<div class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
  
  <div class="w-full max-w-md bg-white p-8 rounded-lg shadow-md">
    
    <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">Connexion</h2>

    <form nz-form [formGroup]="validateForm" (ngSubmit)="login()">
      
      <nz-form-item class="mb-4">
        <nz-form-control nzErrorTip="Email requis">
          <nz-input-group nzSize="large" [nzPrefix]="prefixUser">
            <input type="email" nz-input formControlName="email" placeholder="Email" class="rounded-md" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item class="mb-6">
        <nz-form-control nzErrorTip="Mot de passe requis">
          <nz-input-group nzSize="large" [nzPrefix]="prefixLock">
            <input type="password" nz-input formControlName="password" placeholder="Mot de passe" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      <button nz-button 
              nzType="primary" 
              nzSize="large" 
              class="w-full h-12 font-semibold uppercase tracking-wide rounded-md">
        Se connecter
      </button>
      
    </form>
  </div>
</div>

<ng-template #prefixUser><span nz-icon nzType="user" class="text-gray-400"></span></ng-template>
<ng-template #prefixLock><span nz-icon nzType="lock" class="text-gray-400"></span></ng-template>
