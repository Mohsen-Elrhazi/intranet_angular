<div class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
  <div class="relative w-full max-w-md bg-white p-8 pt-12 rounded-xl shadow-xl">
    <div class="absolute -top-12 left-1/2 -translate-x-1/2">
      <div class="p-1 bg-gray-100 rounded-full shadow-sm">
        <nz-avatar
          [nzSize]="96"
          nzIcon="user"
          class="border-4 border-white shadow-md flex items-center justify-center"
        ></nz-avatar>
      </div>
    </div>

    <div class="text-center mb-8 mt-4">
      <h2 class="text-3xl font-semibold text-gray-800 tracking-tight">Login</h2>
      <!-- <p class="text-gray-500 text-sm mt-1">Accédez à votre espace Intranet</p> -->
    </div>

    <form nz-form [formGroup]="validateForm" (ngSubmit)="login()">
      <nz-form-item class="mb-4">
        <nz-form-control nzHasFeedback [nzErrorTip]="emailErrorTpl">
          <nz-input-wrapper>
            >
            <nz-icon nzInputPrefix nzType="user" />
            <input
              type="email"
              nz-input
              nzSize="large"
              formControlName="email"
              placeholder="Email"
            />
          </nz-input-wrapper>
          <ng-template #emailErrorTpl let-control>
            @if (control.hasError('required')) {
              L'email est requis !
            }
            @if (control.hasError('email')) {
              Veuillez entrer un email valide !
            }
          </ng-template>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item class="mb-6">
        <nz-form-control nzHasFeedback [nzErrorTip]="passwordErrorTpl">
          <nz-input-password>
            <nz-icon nzInputPrefix nzType="lock" />
            <input nz-input nzSize="large" formControlName="password" placeholder="Mot de passe" />
          </nz-input-password>
          <ng-template #passwordErrorTpl let-control>
            @if (control.hasError('required')) {
              Le mot de passe est requis !
            }
          </ng-template>
        </nz-form-control>
      </nz-form-item>

      <button
        nz-button
        [nzLoading]="isLoading()"
        nzType="primary"
        nzSize="large"
        class="w-full h-12 font-semibold uppercase tracking-wide rounded-md"
      >
        Se connecter
      </button>
    </form>
  </div>
</div>
