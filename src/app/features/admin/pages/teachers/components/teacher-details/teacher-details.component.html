@if (teacher(); as t) {
  <div class="flex flex-col h-full bg-white">
    <div class="p-6 border-b border-gray-100 bg-gray-50/50">
      <div class="flex items-center gap-6">
        <nz-avatar
          [nzSize]="100"
          nzShape="square"
          [nzSrc]="t.profileImageUrl"
          nzIcon="user"
          class="shadow-sm border border-gray-200 rounded-lg"
        >
        </nz-avatar>

        <div class="flex flex-col">
          <h2 class="text-xl font-semibold text-gray-900 mb-1">
            {{ t.firstName }} {{ t.lastName }}
          </h2>
        </div>
      </div>
    </div>

    <div class="flex-1 p-6 overflow-y-auto">
      <nz-descriptions nzTitle="Informations Personnelles" nzLayout="horizontal" [nzColumn]="2">
        <nz-descriptions-item nzTitle="Prénom">{{ t.firstName }}</nz-descriptions-item>
        <nz-descriptions-item nzTitle="Nom">{{ t.lastName }}</nz-descriptions-item>
        <nz-descriptions-item nzTitle="Email">{{ t.email }} </nz-descriptions-item>
        <nz-descriptions-item nzTitle="Téléphone">{{ t.phoneNumber }}</nz-descriptions-item>
      </nz-descriptions>

      <nz-divider></nz-divider>

      <nz-descriptions nzTitle="Détails Académiques" nzLayout="horizontal" [nzColumn]="2">
        <nz-descriptions-item nzTitle="Spécialité">{{ t.specialization }} </nz-descriptions-item>
        <nz-descriptions-item nzTitle="Role">
          @if (t.role === 'TEACHER') {
            Enseignant
          }
        </nz-descriptions-item>
      </nz-descriptions>
    </div>

    <div class="p-4 border-t border-gray-100 flex justify-end gap-3">
      <button nz-button nzType="default" (click)="close()">Fermer</button>
      <button nz-button nzType="primary" (click)="onEdit(t)">
        <nz-icon nzType="edit" />
        Modifier le profil
      </button>
    </div>
  </div>
} @else {
  <div class="p-10 flex justify-center items-center h-full">
    <nz-spin nzSize="large"></nz-spin>
  </div>
}
