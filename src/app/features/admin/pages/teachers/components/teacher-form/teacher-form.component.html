<form nz-form [formGroup]="validateForm" (ngSubmit)="envoyer()" nzLayout="vertical">
  <div class="px-6 py-2">
    <div class="grid grid-cols-2 gap-4">
      <nz-form-item>
        <nz-form-label nzFor="firstName" nzRequired>Prénom</nz-form-label>
        <nz-form-control>
          <input
            type="text"
            nz-input
            formControlName="firstName"
            id="firstName"
            placeholder="Entrez le prénom"
          />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="lastName" nzRequired>Nom</nz-form-label>
        <nz-form-control>
          <input
            nz-input
            type="text"
            id="lastName"
            formControlName="lastName"
            placeholder="Entrez le nom"
          />
        </nz-form-control>
      </nz-form-item>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <nz-form-item>
        <nz-form-label nzFor="email" nzRequired>Email</nz-form-label>
        <nz-form-control>
          <input
            type="text"
            nz-input
            formControlName="email"
            id="email"
            placeholder="Entrez l'email"
          />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="password" nzRequired>Mot de passe</nz-form-label>
        <nz-form-control nzErrorTip="Mot de passe requis">
          <nz-input-password>
            <input
              nz-input
              nzSize="default"
              formControlName="password"
              id="password"
              placeholder="Mot de passe"
            />
          </nz-input-password>
        </nz-form-control>
      </nz-form-item>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <nz-form-item>
        <nz-form-label nzFor="phone" nzRequired>Téléphone</nz-form-label>
        <nz-form-control>
          <input
            type="text"
            nz-input
            formControlName="phoneNumber"
            id="phone"
            placeholder="Entrez le numéro de téléphone"
          />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="specialization" nzRequired>Spécialité</nz-form-label>
        <nz-form-control nzErrorTip="Spécialité requise">
          <input
            nz-input
            nzSize="default"
            formControlName="specialization"
            id="specialization"
            placeholder="Spécialité"
          />
        </nz-form-control>
      </nz-form-item>
    </div>

    <div class="grid grid-cols-1 gap-4">
      <nz-form-item>
        <nz-form-label nzFor="profileImage">Photo de profil</nz-form-label>
        <nz-form-control>
          <nz-upload
            [nzLimit]="1"
            nzListType="picture"
            [nzBeforeUpload]="beforeUpload"
            [(nzFileList)]="fileList"
          >
            <button nz-button type="button">
              <nz-icon nzType="upload" />
              Choisir une photo
            </button>
          </nz-upload>
        </nz-form-control>
      </nz-form-item>
    </div>

    <!--  -->
  </div>

  <div class="h-[1px] bg-gray-200"></div>

  <div class="flex justify-end gap-2 py-[10px] px-4 bg-white rounded-b-lg">
    <button nz-button nzType="default" type="button" (click)="fermer()">Annuler</button>

    <button
      [nzLoading]="isLoading"
      nz-button
      nzType="primary"
      type="submit"
      [disabled]="!validateForm.valid"
    >
      Ajouter
    </button>
  </div>
</form>
